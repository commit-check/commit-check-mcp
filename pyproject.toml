[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-check-mcp"
description = "MCP server exposing commit-check validation tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Xianpeng Shen", email = "xianpeng.shen@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "commit-check>=2.11.0,<3",
  "mcp>=1.27.0,<3"
]
dynamic = ["version"]

[project.urls]
source = "https://github.com/commit-check/commit-check-mcp"
tracker = "https://github.com/commit-check/commit-check-mcp/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0,<10",
  "pytest-cov>=6.0.0,<8"
]

[project.scripts]
commit-check-mcp = "commit_check_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
