name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
change-template: "- $TITLE by @$AUTHOR (#$NUMBER)"
change-title-escapes: "\\<*_&`"
no-changes-template: "- No user-facing changes in this release."
template: |
  ## What's Changed

  $CHANGES

categories:
  - title: Features
    labels:
      - feature
  - title: Fixes
    labels:
      - fix
  - title: Documentation
    labels:
      - docs
  - title: Maintenance
    labels:
      - chore
      - refactor
      - test
      - ci
      - dependencies

exclude-labels:
  - skip-changelog

version-resolver:
  major:
    labels:
      - major
      - breaking
  minor:
    labels:
      - feature
  patch:
    labels:
      - fix
      - docs
      - chore
      - refactor
      - test
      - ci
      - dependencies
  default: patch
