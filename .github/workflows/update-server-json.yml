name: Update server.json & publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-server-json:
    name: Update server.json with new version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Extract version from release tag
        id: version
        run: |
          # Strip leading 'v' from tag name (e.g. v0.1.6 -> 0.1.6)
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            # For workflow_dispatch, use latest git tag
            TAG="$(git describe --tags --abbrev=0)"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show extracted version
        run: |
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "Version: ${{ steps.version.outputs.version }}"

      - name: Update server.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating server.json version to $VERSION"

          # Update both root and package version in one pass
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

          echo "=== Updated server.json ==="
          cat server.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add server.json
          if git diff --cached --quiet; then
            echo "No changes to server.json — skipping commit."
            exit 0
          fi

          VERSION="${{ steps.version.outputs.version }}"
          git commit -m "chore: bump server.json version to $VERSION"
          git push

      - name: Validate server.json against MCP schema
        run: |
          # Basic JSON validity check
          jq empty server.json && echo "✓ server.json is valid JSON"

          # Check required fields
          REQUIRED_FIELDS="name title description version"
          for field in $REQUIRED_FIELDS; do
            if jq -e ".$field" server.json > /dev/null 2>&1; then
              echo "✓ field '$field' present"
            else
              echo "✗ field '$field' missing!"
              exit 1
            fi
          done

